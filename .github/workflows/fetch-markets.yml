name: Fetch markets

on:
  schedule:
    # GitHub drops many scheduled runs, so ask every 20 minutes; the script
    # only commits when a source has published new figures.
    - cron: "7,27,47 6-22 * * 1-5"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/fetch_markets.py
      - .github/workflows/fetch-markets.yml

permissions:
  contents: write

concurrency: fetch-markets

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet openpyxl
      - run: python3 .github/fetch_markets.py
      - name: Commit new figures
        run: |
          git add markets/data.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update market data"
          git pull --rebase --quiet origin master
          git push
