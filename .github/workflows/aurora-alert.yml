name: Aurora alert

on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal, test (send a test notification) or dry-run (print only)"
        type: choice
        options: [dry-run, test, normal]
        default: dry-run

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/aurora_alert.py --mode "${{ inputs.mode || 'normal' }}"
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
